<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Software Engineering Memory architecture</title>
  <desc id="desc">A diagram showing agents and contributors reading repository memory files before planning, implementation, verification, and review.</desc>
  <rect width="1200" height="675" fill="#050505"/>
  <rect x="64" y="56" width="1072" height="563" rx="28" fill="#111827" stroke="#374151" stroke-width="2"/>

  <text x="96" y="118" fill="#F9FAFB" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">AI Software Engineering Memory</text>
  <text x="98" y="158" fill="#9CA3AF" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="22">Durable repository knowledge for AI coding agents</text>

  <rect x="95" y="220" width="230" height="92" rx="14" fill="#1F2937" stroke="#60A5FA" stroke-width="2"/>
  <text x="127" y="258" fill="#DBEAFE" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">AGENTS.md</text>
  <text x="127" y="288" fill="#D1D5DB" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17">Agent behavior</text>

  <rect x="95" y="354" width="230" height="92" rx="14" fill="#1F2937" stroke="#34D399" stroke-width="2"/>
  <text x="127" y="392" fill="#D1FAE5" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">memory/</text>
  <text x="127" y="422" fill="#D1D5DB" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17">Durable context</text>

  <rect x="95" y="488" width="230" height="92" rx="14" fill="#1F2937" stroke="#FBBF24" stroke-width="2"/>
  <text x="127" y="526" fill="#FEF3C7" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">templates/</text>
  <text x="127" y="556" fill="#D1D5DB" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17">Plan and review</text>

  <rect x="470" y="224" width="255" height="88" rx="14" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <text x="515" y="262" fill="#F8FAFC" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Read memory</text>
  <text x="515" y="292" fill="#CBD5E1" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17">Start from repo context</text>

  <rect x="470" y="356" width="255" height="88" rx="14" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <text x="515" y="394" fill="#F8FAFC" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Plan and build</text>
  <text x="515" y="424" fill="#CBD5E1" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17">Preserve boundaries</text>

  <rect x="470" y="488" width="255" height="88" rx="14" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
  <text x="515" y="526" fill="#F8FAFC" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Verify and review</text>
  <text x="515" y="556" fill="#CBD5E1" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="17">Check risk before handoff</text>

  <rect x="870" y="264" width="220" height="252" rx="18" fill="#172554" stroke="#3B82F6" stroke-width="2"/>
  <text x="910" y="315" fill="#EFF6FF" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Outcome</text>
  <text x="910" y="362" fill="#DBEAFE" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="19">Less rediscovery</text>
  <text x="910" y="398" fill="#DBEAFE" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="19">Consistent changes</text>
  <text x="910" y="434" fill="#DBEAFE" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="19">Clearer boundaries</text>
  <text x="910" y="470" fill="#DBEAFE" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-size="19">Better handoffs</text>

